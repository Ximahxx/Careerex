<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WEEK 4 ASSIGNMENT: Loops | Conditionals | Logical Operators | Functions</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Loops | Conditionals | Logical Operators | Functions</h1>
    </header>

    <div class="container">
<!-- 
CODE FOR QUESTION 1
Form that takes a student’s score and logs "Passed" if it’s 180 and above, else logs "Failed" 
-->
        <div class="card">
            <form id="form1">
                <h2>Question One</h2>
                <label for="score_input">Enter JAMB score</label><br>
                <input type="number" name="score_input" id="score_input">
                <p id="output1">&nbsp;</p>
            </form>
            <button class="pt-70" onclick="jamb_grade(document.getElementById('form1').elements[0].value)">Submit</button>
        </div>

<!-- 
CODE FOR QUESTION 2
Form that accepts an age and returns "You are eligible to vote" if the age is 18 or above, otherwise "Not eligible"
 -->                
        <div class="card">
            <form id="form2">
                <h2>Question Two</h2>
                <label for="age">Enter your age</label><br>
                <input type="number" name="age" id="age">
                <p id="output2">&nbsp;</p>
            </form>
            <button class="pt-70" onclick="eligibility(document.getElementById('form2').elements[0].value)">Submit</button>
        </div>

<!-- 
CODE FOR QUESTION 3
Form that takes a name and score, then returns:
"Excellent" if score >= 90
"Good" if score >= 75
"Average" if score >= 50
"Fail" otherwise
 -->
        <div class="card">
            <form id="form3">
                <h2>Question Three</h2>
                <label for="name">Enter your name</label><br>
                <input type="text" name="name" id="name"><br>

                <label for="score">Enter your score</label><br>
                <input type="number" name="score" id="score">
                <p id="output3">&nbsp;</p>
            </form>
            <button class="pt-20" onclick="grade(document.getElementById('form3').elements[0].value, document.getElementById('form3').elements[1].value), console.log(grade(document.getElementById('form3').elements[0].value, document.getElementById('form3').elements[1].value))">Submit</button>
        </div>
    </div>

    <div class="container">
<!-- 
CODE FOR QUESTION 4
Form that takes two boolean values: hasID and isAbove18. Return "Access granted" only if both are true
 -->
        <div class="card">
            <form id="form4">
                <h2>Question Four</h2>
                <label>Do you have an ID</label><br>
                <input type="radio" name="hasId" id="yes1" value="yes">
                <label for="yes">Yes</label><br>
                <input type="radio" name="hasId" id="no1" value="no">
                <label for="no">No</label><br>
                <label>Are you above 18</label><br>
                <input type="radio" name="isAbove" id="yes2" value="yes">
                <label for="yes">Yes</label><br>
                <input type="radio" name="isAbove" id="no2" value="no">
                <label for="no">No</label>
                <p id="output4">&nbsp;</p>
            </form>
            <button onclick="accessibility(document.getElementById('yes1').checked, document.getElementById('yes2').checked)">Submit</button>
        </div>

        <div class="card">
            <h2>Question Five</h2>
            <p id="question5"></p>
            <p id="output5">&nbsp;</p>
        </div>

<!-- 
CODE FOR QUESTION 6
Form that returns "Yes" if a student passed both Math and English (score ≥ 50), else "No"
-->
        <div class="card">
            <form id="form6">
                <h2>Question Six</h2>
                <label for="mathGrade">Enter Math score</label><br>
                <input type="number" name="mathGrade" id="mathGrade"><br>
                <label for="engGrade">Enter English score</label><br>
                <input type="number" name="engGrade" id="engGrade">
                <p id="output6">&nbsp;</p>
            </form>
            <button class="pt-20" onclick="mathEngGrade(document.getElementById('mathGrade').value, document.getElementById('engGrade').value)">Submit</button>
        </div>
    </div>

    <div class="container">

<!-- 
CODE FOR QUESTION 7
Form that checks if a user has either an email or a phone number before signing up
-->
        <div class="card">
            <form id="form7">
                <h2>Question Seven</h2>
                <label for="email">Do you have an email or a phone number</label><br>
                <input type="radio" name="info" id="email">
                <label for="email">I have an email</label><br>
                <input type="radio" name="info" id="number">
                <label for="email">I have a phone number</label><br>
                <input type="radio" name="info" id="none">
                <label for="none">I have none</label><br><br>
                <p id="output7">&nbsp;</p>
            </form>
            <button class="pt-20" onclick="checkUserInfo(document.getElementById('email').checked, document.getElementById('number').checked)">Submit</button>
        </div>

<!-- 
CODE FOR QUESTION 8
Form that takes username and password
If either one is empty, returns "Invalid input" using the || operator
-->
        <div class="card">
            <form id="form8">
                <h2>Question Eight</h2>
                <label for="username">Enter Username</label><br>
                <input type="text" name="username" id="username" value=""><br>
                <label for="password">Enter Password</label><br>
                <input type="text" name="password" id="password" value="">
                <p id="output8">&nbsp;</p>
            </form>
            <button class="pt-20" onclick="loginValidity(document.getElementById('username').value, document.getElementById('password').value)">Submit</button>
        </div>

<!-- 
CODE FOR QUESTION 9
Form that accepts hours worked
If hours ≥ 40, returns "Full-time", else "Part-time" using a ternary operator
-->
        <div class="card">
            <form id="form9">
                <h2>Question Nine</h2>
                <label for="score_input">Enter hours worked</label><br>
                <input type="number" name="hours" id="hours">
                <p id="output9">&nbsp;</p>
            </form>
            <button class="pt-70" onclick="jobTypeOutput(document.getElementById('hours').value)">Submit</button>
        </div>
    </div>

<!--
CODE FOR QUESTION 10
Form that takes two numbers and returns the larger one
 -->        
    <div class="container">
        <div class="card">
            <form id="form10">
                <h2>Question Ten</h2>
                <label for="num1">Enter first number</label><br>
                <input type="number" name="num1" id="num1"><br>
                <label for="num2">Enter second number</label><br>
                <input type="number" name="num2" id="num2">
                <p id="output10">&nbsp;</p>
            </form>
            <button class="pt-20" onclick="max(Number(document.getElementById('num1').value), Number(document.getElementById('num2').value))">Submit</button>
        </div>
    </div>
    <script src="index.js"></script>
</body>
</html>
